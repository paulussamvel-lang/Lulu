 {id:3,name:'深色影棚',short:'专注 · 重音频',desc:'从逐字稿走到配音，把声音参数放在手边。',why:'适合晚间工作和配音检查。大段文稿、波形时间轴、语速与情绪参数分区呈现。',colors:['#19212c','#f2ad8b','#a1afbf'],view:'voice'},

];
const params=new URLSearchParams(location.search);let style=Number(params.get('style'))||4;let current=directions.find(x=>x.id===style)||directions[3];let stage=params.get('stage')||current.view;let filter='全部';let selectedDoc=0;let paused=false;let clips=['你缺的可能不是一个新工具，而是一次可以照着做的演示。','先找到一个真实问题，再让工具解决它。'];let toastTimer;let moved=false;let sharedStage=null;let draftText='你是不是也存了一大堆 AI 工具，真正用起来的却没几个？\n\n你缺的可能不是一个新工具，而是一次可以照着做的演示。从拿到素材，到写成文案，再听一遍节奏。这次，我们只解决一个真实问题。';
const docs=[{title:'把一个真实问题拍清楚',source:'口播草稿 · 486 字',intro:'工具演示，先让观众看懂自己为什么需要。'},{title:'从一个小动作开始',source:'参考文案 · 312 字',intro:'不堆功能，只演示一个能马上完成的动作。'},{title:'为什么总在重复找工具',source:'录音转写 · 1,280 字',intro:'把资料收集和真正做出结果分开看。'}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const btn=(text,action,kind='btn')=>`<button class="${kind}" data-action="${action}">${text}</button>`;
function article(alternate=false){return alternate?`<p>我以前介绍一款工具，总想把所有功能都讲完。观众听到了很多名词，却不知道自己该从哪里开始。</p><p><mark>后来我只做一件事：把一个问题从头到尾解决给你看。</mark>从原始素材，到最后能用的结果，中间每一步都留下来。</p><p>如果今天只能学会一个动作，你希望它帮你省掉什么麻烦？</p>`:`<p>你是不是也存了一大堆 AI 工具，真正用起来的却没几个？</p><p><mark>你缺的可能不是一个新工具，而是一次可以照着做的演示。</mark>比如把一段录音，变成一篇能直接开口讲的文案。</p><p>先拿到素材，再提取文字。挑出最有用的三句话，补上自己的真实经历，最后再听一遍节奏。</p><p>所以这条视频，我只解决一个问题：<mark>怎样让收集来的素材，真正变成你自己的表达。</mark></p>`;}
function chain(){return `<div class="chain">${[['import','download','下载素材'],['tasks','wave','提取文字'],['editor','pen','精选组稿'],['voice','mic','制作配音']].map((x,i)=>`${i?'<span class="arrow" aria-hidden="true"></span>':''}<button data-stage="${x[0]}" class="${stage===x[0]?'active':''}" ${stage===x[0]?'aria-current="step"':''}>${icons(x[1])}${x[2]}</button>`).join('')}<span class="chain-meta">当前选题：工具演示</span></div>`;}

function heading(title,sub,button=''){return `<div class="page-heading"><div><h2>${title}</h2><p>${sub}</p></div>${button}</div>`;}
const tasks=[{name:'AI 工具演示 · 原始录音.m4a',time:'12:36',model:'SenseVoice Q8',state:'正在转录',cls:'',action:'查看进度',type:'M4A'}, {name:'工具使用记录 · 第 2 段.mp4',time:'04:18',model:'Whisper Turbo',state:'已完成',cls:'success',action:'去组稿',type:'MP4'}, {name:'一段想法 · 补录.wav',time:'02:47',model:'MOSS Q5',state:'需要处理',cls:'error',action:'查看原因',type:'WAV'}, {name:'从一个小动作开始.mp3',time:'03:22',model:'SenseVoice Q8',state:'已完成',cls:'success',action:'去组稿',type:'MP3'}];
function taskView(){let rows=tasks.filter(t=>filter==='全部'||t.state===filter);return heading('让素材，继续向前。','先处理一份素材，再接着完成文案与配音。',btn(`${icons('plus')}添加素材`,'import','btn primary'))+`<div class="task-layout"><section><div class="section-bar"><h3 style="margin:0">内容转录</h3><div class="filters" aria-label="筛选任务">${['全部','正在转录','需要处理'].map(f=>`<button data-filter="${f}" class="${filter===f?'active':''}">${f}</button>`).join('')}</div></div><table class="task-table"><thead><tr><th>素材</th><th>转录模型</th><th>状态</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td><div class="row"><span class="file-icon">${t.type}</span><div><div class="file-title">${t.name}</div><div class="file-sub">工具演示 · ${t.time}</div></div></div></td><td class="muted">${t.model}</td><td><span class="badge ${t.cls}">${t.state==='正在转录'&&paused?'已暂停':t.state}</span></td><td>${btn(t.action,t.state==='已完成'?'editor':t.state==='需要处理'?'error':'progress','quiet')}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty-filter">这个分类里没有任务，切换「全部」继续。</div>'}<div class="quality">示例任务不执行真实转录；切换筛选可查看不同状态。</div></section><aside class="panel running-panel"><div class="row between"><h3 style="margin:0">当前处理</h3><span class="badge">${paused?'已暂停':'本地转录'}</span></div><h4>AI 工具演示<br>原始录音</h4><div class="progress"><span></span></div><dl><dt>已处理音频</dt><dd class="num">07:56 / 12:36</dd><dt>已运行</dt><dd class="num">02:18</dd><dt>预计剩余</dt><dd>约 1 分 20 秒</dd></dl>${btn(paused?'继续处理':'暂停处理','pause','btn')}<div class="next-action"><b>完成之后</b><br><span class="muted">逐字稿会进入这个选题，接着挑选片段、整理文案。</span>${btn('查看文案工作区 '+icons('arrow'),'editor','btn primary')}</div></aside></div>`;}
function clipList(){return clips.map((t,i)=>`<div class="clip-item"><b>${String(i+1).padStart(2,'0')} · ${i?'核心观点':'开场共鸣'}</b>${esc(t)}<div class="row between" style="margin-top:7px"><span class="quote-tag">来自原文 · 可回溯</span><button class="quiet" data-remove="${i}" aria-label="移除第 ${i+1} 个精选片段">移除</button></div></div>`).join('');}
function review(){return `<h3>文案对比</h3><div class="row between"><span class="label">参考评分</span><span class="badge">示例 · 非模型结果</span></div><div class="scores"><span>开头吸引力</span><span>17 / 20</span><span>表达清晰度</span><span>18 / 20</span><span>口播节奏</span><span>16 / 20</span><span>内容价值</span><span>13 / 15</span></div><div class="review-note">第一篇适合作为主线。第二篇的「一个动作」可以补充具体做法。</div><label class="label" for="review-model">评分模型</label><select id="review-model" style="width:100%;margin-top:9px;font-size:12px" aria-label="文案评分模型"><option>暂不选择模型</option><option>豆包 · 待配置连接</option><option>Gemini · 待配置连接</option><option>千问 · 待配置连接</option><option>DeepSeek · 待配置连接</option></select>${btn('查看评分方式','score','btn')}`;}
function editorView(){if(style===4)return libraryView();if(style===2)return heading('把观点，写成自己的表达。','工具演示 / 文案精选 · 原文与精选分开保存',btn('进入配音 '+icons('arrow'),'voice','btn primary'))+`<nav class="paper-tabs" aria-label="文案工作区"><button class="active" data-action="compare-docs">双稿对读</button><button data-action="assembly">精选组稿</button><button data-action="history">修改记录</button></nav><div class="paper-duo"><section><span class="badge">主稿</span><h3>${docs[0].title}</h3><span class="sample-source">口播草稿 · 486 字 · 原文副本</span><div class="article">${article()}</div>${btn('选入这一段','clip','btn')}</section><section><span class="badge">参考稿</span><h3>${docs[1].title}</h3><span class="sample-source">参考文案 · 312 字 · 原文副本</span><div class="article">${article(true)}</div>${btn('选入参考段落','clip-alt','btn')}</section><section>${review()}<div class="review-note">已选 ${clips.length} 个片段<br>组稿时保留每段来源。</div>${btn('按顺序组稿','assembly','btn primary')}</section></div>`;return heading('先挑出，值得留下的句子。','工具演示 / 文案精选 · 原文保留，组稿另存',btn('进入配音 '+icons('arrow'),'voice','btn primary'))+`<div class="editor-layout"><section><div class="doc-heading"><div class="row between"><span class="label">原文副本 / 主稿</span><span class="badge success">已保存在本机</span></div><h3 class="doc-title">${docs[selectedDoc].title}</h3><span class="tiny muted">486 字 · 来源：口播草稿 · 示例文案</span></div><div class="article">${article(selectedDoc===1)}</div><div class="edit-tools"><span class="tiny muted">选中文字，也可以加入右侧精选。</span>${btn('将选中文字加入精选','selection','btn')}</div></section><aside class="clip-panel"><div class="row between"><h3 style="margin:0">精选片段</h3><span class="label">${clips.length} 段</span></div>${clipList()}${btn('按顺序组稿 '+icons('arrow'),'assembly','btn primary')}<div class="review-note" style="margin-top:18px">组稿后可继续编辑，再进入配音。原文不会被覆盖。</div></aside></div>`;}
function libraryView(){return `<div class="library-layout"><aside class="library-list"><div class="row between" style="margin-bottom:17px"><h3 style="margin:0">选题文稿</h3><span class="label">3 篇</span></div><label class="label" for="doc-search">搜索当前选题</label><input id="doc-search" placeholder="搜索文稿…" type="search" style="margin-top:8px">${docs.map((d,i)=>`<button class="doc-choice ${selectedDoc===i?'active':''}" data-doc="${i}"><strong>${d.title}</strong><p>${d.intro}</p><span class="tiny muted">${d.source}</span></button>`).join('')}<div class="quality">工具演示<br>素材 → 逐字稿 → 文案 → 配音</div></aside><section class="library-document"><div class="row between"><span class="label">原文副本 · 工具演示</span><span class="badge success">本地保存</span></div><h2 class="doc-title">${docs[selectedDoc].title}</h2><div class="tiny muted" style="margin-bottom:24px">来源：${docs[selectedDoc].source} · 原文与来源一起保留</div><div class="article">${article(selectedDoc===1)}</div><div class="edit-tools"><span class="tiny muted">选中文字可直接收录</span>${btn('加入精选','selection','btn')}</div><div class="next-action"><span class="muted">下一步：整理精选，再制作配音。</span>${btn('进入配音 '+icons('arrow'),'voice','btn primary')}</div></section><aside class="library-side"><div class="row between"><h3 style="margin:0">这次精选</h3><span class="label">${clips.length} 段</span></div>${clipList()}${btn('按顺序组稿','assembly','btn primary')}<div class="review-note" style="margin-top:20px">每个片段都保留原文来源。资料越多，也能找回上下文。</div></aside></div>`;}
function voiceView(){const bars=Array.from({length:108},(_,i)=>{let h=10+Math.abs(Math.sin(i*1.7)*Math.cos(i*.23))*64;return `<rect x="${i*6}" y="${(88-h)/2}" width="3" height="${h}" rx="1" opacity="${i<53?1:.32}"/>`;}).join('');return heading('让文案，听起来像你。','工具演示 / 配音制作 · 精选组稿已接入',btn('返回文案','editor','btn'))+`<div class="voice-layout"><section><div class="panel script-box"><div class="label"><span>待配音文案</span><span>原稿保留 · 可继续修改</span></div><textarea aria-label="待配音文案">${esc(draftText)}</textarea><div class="row between"><span class="tiny muted">约 45 秒 · 示例估算</span>${btn('将选中段落设为试听范围','preview-range','quiet')}</div></div><div class="panel wave-panel"><div class="row between"><h3 style="margin:0;font-size:13px">片段试听</h3><span class="badge">示例波形 · 无真实音频</span></div><div class="time-ruler"><span>00:00</span><span>00:10</span><span>00:20</span><span>00:30</span><span>00:40</span></div><svg viewBox="0 0 648 88" preserveAspectRatio="none" aria-label="示例音频波形">${bars}</svg><div class="wave-actions">${btn(icons('play')+'试听示例界面','listen','btn')}<span class="num muted">00:21 / 00:45</span>${btn('查看生成历史','history','quiet')}</div></div></section><aside class="panel voice-settings"><h3>声音与表达</h3><label for="voice-model">配音模型</label><select id="voice-model"><option>IndexTTS 2.5</option><option>VoxCPM2</option><option>Qwen3-TTS</option></select><label for="voice-reference">参考音色</label><select id="voice-reference"><option>我的口播声音 · 示例</option><option>选择参考音频…</option></select><div class="row between"><label for="speed">语速</label><output id="speed-value" class="tiny num">1.00×</output></div><input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"><label>情绪方式</label><div class="voice-presets" aria-label="情绪预设">${['自然','平静','有活力'].map((x,i)=>`<button class="btn ${i===0?'active':''}" data-emotion="${x}">${x}</button>`).join('')}</div><label for="silence">句间停顿</label><select id="silence"><option>200 毫秒</option><option>400 毫秒</option><option>600 毫秒</option></select>${btn('生成配音预览','generate','btn primary')}<p class="tiny muted" style="margin-bottom:0">设计演示不会加载模型，也不会生成真实音频。</p></aside></div>`;}
function importView(){return heading('从一份素材，开始。','粘贴作品链接，或导入本地录音。之后沿同一条流程继续。')+`<div class="import-layout"><section><div class="drop-zone">${icons('download')}<h3>把音视频放到这里</h3><p>MP4、MOV、MP3、M4A、WAV · 支持批量</p>${btn('选择示例素材','add-sample','btn primary')}</div><div class="link-field"><label for="url-input">抖音、B站、YouTube 或播客作品链接</label><div class="row"><input id="url-input" type="url" placeholder="粘贴作品链接…">${btn('加入当前选题','add-link','btn')}</div></div><div class="quality">抖音：使用浏览器识别当前作品，优先可用的最高画质。这里只展示流程，不访问平台。</div></section><aside class="import-aside"><h3>接下来会发生什么</h3><ul><li>下载完成，素材归入当前选题</li><li>选择本地转录模型，提取文字</li><li>对比文案，挑出有用片段</li><li>整理自己的表达，再制作配音</li></ul><span class="tiny muted">每一步都能返回上一步。<br>原始素材与文稿保留。</span>${btn('先看转录工作区 '+icons('arrow'),'tasks','btn primary')}</aside></div>`;}
function boardView(){return heading('一份素材，一路做到成稿。','工具演示 / 工作流程 · 示例选题',btn(icons('plus')+'添加素材','import','btn primary'))+`<div class="board">${[
 ['下载素材',[['MP4','工具演示 · 原始视频','链接已识别，等待下载','等待处理','', '开始下一步','tasks'],['M4A','补录一个真实例子','本地录音 · 02:47','已导入','success','去转录','tasks']]],
 ['提取文字',[['M4A','AI 工具演示 · 原始录音','已处理 07:56 / 12:36','正在转录','','查看进度','tasks']]],
 ['精选组稿',[['TXT','把一个真实问题拍清楚',`${clips.length} 个片段已加入精选`,moved?'已整理':'待整理','warning','继续组稿','editor'],['TXT','从一个小动作开始','参考文案 · 312 字','可对比','','查看文案','editor']]],
 ['制作配音',[['WAV','工具演示 · 口播第一版','已选 IndexTTS 2.5 · 参考音色待确认','待配音','','调整声音','voice']]]
 ].map(([title,items],i)=>`<section class="board-column"><div class="board-heading"><span>${title}</span><span class="count">${items.length} 项</span></div>${items.map(x=>`<article class="board-item"><div class="row between"><span class="file-icon">${x[0]}</span><span class="badge ${x[4]}">${x[3]}</span></div><h3>${x[1]}</h3><p>${x[2]}</p>${x[3]==='正在转录'?'<div class="progress" style="margin-bottom:17px"><span></span></div>':''}${btn(x[5]+' '+icons('arrow'),x[6],'btn')}</article>`).join('')}</section>`).join('')}</div><div class="stage-footer">${icons('flow')}<span>原始素材、逐字稿、精选和配音归在同一个选题下。</span>${btn('查看这条创作链路','lineage','btn')}</div>`;}
function render(){document.querySelector('.style-tabs').innerHTML=directions.map(d=>`<button class="style-tab" role="tab" aria-selected="${style===d.id}" data-style="${d.id}"><span class="style-number">${d.id}</span><span><b>${d.name}</b><small>${d.short}</small></span><span class="swatches" aria-hidden="true">${d.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`).join('');document.querySelector('#direction-copy').innerHTML=`<strong>方案 ${style} · ${current.name}</strong>${current.desc}`;document.querySelector('#design-rationale').innerHTML=`<b>这套为什么适合你：</b>${current.why}`;document.querySelectorAll('.mode-buttons button').forEach(b=>b.classList.toggle('active',b.dataset.stage===stage));const app=document.querySelector('#app');app.dataset.style=style;app.innerHTML=nav()+`<div class="app-main"><header class="app-top"><div class="crumb"><span>我的创作</span><span>/</span><b>工具演示</b></div><div class="row" style="gap:21px"><span class="search">${icons('search')}查找素材与文稿 <kbd>⌘ K</kbd></span><button class="iconbtn" data-action="settings" aria-label="工作台设置">${icons('setting')}</button></div></header>${chain()}<section class="content" aria-live="polite">${({tasks:taskView,editor:editorView,voice:voiceView,import:importView,board:boardView}[stage]||taskView)()}</section></div>`;if(params.has('frame'))document.documentElement.classList.add('view-only');}
function message(text){clearTimeout(toastTimer);document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=text;document.querySelector('#app').append(e);toastTimer=setTimeout(()=>e.remove(),4500);}
function setStage(s){stage=s;render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.style){style=Number(b.dataset.style);current=directions.find(d=>d.id===style);stage=sharedStage||current.view;render();history.replaceState(null,'',`?style=${style}${params.has('frame')?'&frame=1':''}`);return;}if(b.dataset.stage){if(b.closest('.mode-buttons'))sharedStage=b.dataset.stage;setStage(b.dataset.stage);return;}if(b.dataset.filter){filter=b.dataset.filter;render();return;}if(b.dataset.doc!==undefined){selectedDoc=Number(b.dataset.doc);render();return;}if(b.dataset.remove!==undefined){clips.splice(Number(b.dataset.remove),1);render();return;}if(b.dataset.emotion){document.querySelectorAll('[data-emotion]').forEach(x=>x.classList.toggle('active',x===b));message(`已切换到「${b.dataset.emotion}」示例；没有调用模型。`);return;}const a=b.dataset.action;if(!a)return;if(['editor','voice','tasks','import'].includes(a)){setStage(a);return;}if(a==='pause'){paused=!paused;render();message(paused?'示例任务已暂停；真实任务不受影响。':'示例任务继续；真实任务不受影响。');return;}if(a==='selection'||a==='clip'||a==='clip-alt'){let text=window.getSelection()?.toString().trim();if(!text)text=a==='clip-alt'?'后来我只做一件事：把一个问题从头到尾解决给你看。':'怎样让收集来的素材，真正变成你自己的表达。';clips.push(text.slice(0,500));render();message('已加入示例精选；原始文稿没有改动。');return;}if(a==='assembly'){draftText=clips.join('\n\n');document.querySelector('.content').innerHTML=heading('把精选，整理成自己的文案。','示例组稿 · 可编辑 · 未写入真实文稿',btn('进入配音 '+icons('arrow'),'voice','btn primary'))+`<textarea aria-label="示例组稿正文" style="width:100%;min-height:330px;font-size:17px;padding:26px">${esc(draftText)}</textarea><div class="stage-footer">${clips.length} 段原文来源已保留${btn('返回原文','editor','btn')}</div>`;return;}if(a==='error'){message('示例原因：模型返回不完整。真实版本会保留部分文字，并提供具体错误与重试入口。');return;}if(a==='add-sample'){setStage('tasks');message('示例素材已进入转录环节，没有读取本地文件。');return;}if(a==='add-link'){const value=document.querySelector('#url-input').value.trim();if(!value){document.querySelector('#url-input').focus();message('先输入一个作品链接，再继续预览。');return;}setStage('tasks');message('已预览下一步；没有访问该链接或下载内容。');return;}if(a==='library'){document.querySelector('.content').innerHTML=libraryView();message('示例文稿库：原文、来源与精选并排保留。');return;}const messages={progress:'示例进度：已运行 2 分 18 秒，处理音频 7 分 56 秒。',score:'正式评分会使用你选择的模型连接；这里没有发送文案或调用 API。',generate:'这里只预览生成入口；没有加载模型或生成音频。',listen:'波形是设计示例，没有可播放的真实音频。',history:'正式界面会保留生成版本、参数和参考音频，方便比较。',settings:'正式界面保留模型连接、保存目录、快捷操作与已有偏好设置。',live:'直播录制保留原画、1080P、720P、540P 档位，录制素材可继续进入创作链路。',knowledge:'正式界面继续使用已有飞书与 Obsidian 连接；这里不会同步任何资料。',lineage:'同一个选题关联：原始素材 → 逐字稿 → 精选来源 → 组稿 → 配音。','preview-range':'已预览选段试听操作，没有产生音频。','compare-docs':'当前为双稿对读；可以分别选入主稿和参考稿的段落。'};message(messages[a]||'这是交互设计预览。');});
document.addEventListener('input',e=>{if(e.target.matches('textarea[aria-label="示例组稿正文"],textarea[aria-label="待配音文案"]'))draftText=e.target.value;if(e.target.id==='speed')document.querySelector('#speed-value').textContent=Number(e.target.value).toFixed(2)+'×';if(e.target.id==='doc-search'){let q=e.target.value.trim();document.querySelectorAll('.doc-choice').forEach((b,i)=>b.hidden=q&&!docs[i].title.includes(q));}});
document.querySelector('#compare-button').addEventListener('click',()=>{const grid=document.querySelector('.compare-grid');const show=!grid.classList.contains('show');grid.classList.toggle('show',show);document.querySelector('#compare-button').setAttribute('aria-expanded',show);document.querySelector('#compare-button').textContent=show?'收起并排比较':'并排看五套';if(show&&!grid.childElementCount)grid.innerHTML=directions.map(d=>`<article><div class="mini-label"><span>${d.id} · ${d.name}</span><a href="?style=${d.id}">查看完整界面</a></div><div class="mini-wrap"><iframe title="方案 ${d.id} ${d.name} 缩略预览" src="?style=${d.id}&stage=${d.view}&frame=1" tabindex="-1" loading="lazy"></iframe></div></article>`).join('');if(show){requestAnimationFrame(()=>document.querySelectorAll('.mini-wrap').forEach(w=>{const scale=w.clientWidth/1360;w.style.height=(728*scale)+'px';w.querySelector('iframe').style.transform='scale('+scale+')';}));}if(show)grid.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});});
render();
if(params.has("overview")){document.documentElement.classList.add("overview");document.querySelector("#compare-button").click();}
</script>
</body>
</html>
